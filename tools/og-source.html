<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@500&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0e0f12;color:#f4f4f1;font-family:Manrope,sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(244,244,241,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(244,244,241,.07) 1px,transparent 1px);background-size:72px 72px}
.glow{position:absolute;inset:0;background:radial-gradient(90% 80% at 80% 10%,rgba(174,255,63,.16),transparent 58%)}
.wrap{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-family:Montserrat;font-weight:900;font-size:34px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#aeff3f}
h1{font-family:Montserrat;font-weight:800;font-size:78px;line-height:.98;letter-spacing:-.035em;max-width:17ch}
.lime{color:#aeff3f}
.row{display:flex;align-items:center;gap:28px}
.tag{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#70757c}
.pill{background:#aeff3f;color:#0a0b0d;font-weight:700;font-size:19px;padding:15px 30px;border-radius:999px}
.phone{font-family:"JetBrains Mono",monospace;font-size:21px;font-weight:500}
svg{position:absolute;right:-60px;bottom:40px;width:620px;opacity:.95}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<svg viewBox="0 0 900 340"><defs>
<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a3f47"/><stop offset="46%" stop-color="#23272d"/><stop offset="100%" stop-color="#13161a"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#aeff3f" stop-opacity="0"/><stop offset="35%" stop-color="#aeff3f" stop-opacity=".85"/><stop offset="78%" stop-color="#aeff3f" stop-opacity=".5"/><stop offset="100%" stop-color="#aeff3f" stop-opacity="0"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8e9aa6" stop-opacity=".55"/><stop offset="100%" stop-color="#2a2f36" stop-opacity=".6"/></linearGradient></defs>
<path d="M58 258 C54 228 60 206 86 196 L186 174 C232 128 288 108 352 110 L512 108 C582 110 626 126 668 158 L792 184 C828 192 846 212 846 240 L846 254 C846 262 840 266 828 266 L756 266 Q690 176 624 266 L300 266 Q235 176 170 266 L74 266 C62 266 58 264 58 258 Z" fill="url(#b)"/>
<path d="M96 196 L190 174 C234 130 290 110 352 110 L512 108 C580 110 624 126 666 157" fill="none" stroke="url(#s)" stroke-width="2.5"/>
<path d="M318 126 L508 120 L612 162 L212 172 Z" fill="url(#g)"/>
<path d="M800 196 L838 208 C844 212 845 222 840 226 L800 220 Z" fill="#aeff3f"/>
<g><circle cx="238" cy="252" r="62" fill="#0c0e10"/><circle cx="238" cy="252" r="36" fill="#60666e"/><circle cx="238" cy="252" r="8" fill="#aeff3f"/></g>
<g><circle cx="690" cy="252" r="62" fill="#0c0e10"/><circle cx="690" cy="252" r="36" fill="#60666e"/><circle cx="690" cy="252" r="8" fill="#aeff3f"/></g>
</svg>
<div class="wrap">
  <div class="logo">MOTIVUS<span class="dot"></span></div>
  <div>
    <div class="tag">Automobilių supirkimas · Visa Lietuva</div>
    <h1 style="margin-top:18px">Parduokite automobilį greitai. <span class="lime">Gaukite sąžiningą kainą.</span></h1>
  </div>
  <div class="row"><span class="pill">Gauti pasiūlymą</span><span class="phone">+370 632 22228</span></div>
</div>
</body></html>
